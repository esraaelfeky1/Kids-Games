      #initial-loader {

        transition:

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .initial-loader-decoration {
        position: absolute;
        user-select: none;
        pointer-events: none;

      }

      .initial-star-one {
        top: 14%;

      }

      .initial-heart-one {
        top: 20%;
        left: 15%;
        color: #ff83b7;
        font-size: 34px;
        animation-delay: 1s;
      }

      .initial-heart-two {

        bottom: 20%;
        color: #ff9bca;
        font-size: 28px;
        animation-delay: 0.4s;
      }

      .initial-loader-card {
        position: relative;
        z-index: 1;

        padding: 30px 24px 25px;
        border: 2px solid rgba(255, 255, 255, 0.95);

        margin: 0 0 10px;
        color: #8b5cf6;
        font-size: clamp(22px, 5vw, 27px);
        font-weight: 800;
        line-height: 1.5;
      }

      .initial-loader-subtitle {
        margin: 0 0 24px;
        color: #82768f;
        font-size: 14px;
        line-height: 1.9;
      }

      .initial-progress-track {
        width: 100%;
        height: 11px;
        overflow: hidden;
        border-radius: 20px;
        background: #f0e8fa;
      }

      .initial-progress-fill {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          #ffabd0,
          #bba5ff,
          #9de4fa
        );
        animation: initialProgress 1.5s ease-in-out infinite;
      }

      .initial-loader-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 21px 0 15px;
      }

      .initial-loader-dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        animation: initialDotHop 0.8s ease-in-out infinite alternate;
      }

      .initial-loader-dots span:nth-child(1) {
        background: #ffabd0;
      }

      .initial-loader-dots span:nth-child(2) {
        background: #bba5ff;
        animation-delay: 0.2s;
      }

      .initial-loader-dots span:nth-child(3) {
        background: #9de4fa;
        animation-delay: 0.4s;
      }

      .initial-loader-footer {
        margin: 0;
        color: #a394b3;
        font-size: 12px;
      }

      @keyframes initialFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-5deg);
        }

        50% {
          transform: translateY(-12px) rotate(8deg);
        }
      }

      @keyframes initialCardPop {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes initialLogoBounce {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }

        50% {
          transform: translateY(-5px) rotate(3deg);
        }
      }

      @keyframes initialProgress {
        0% {
          width: 20%;
          transform: translateX(0);
        }

        50% {
          width: 75%;
        }

        100% {
          width: 35%;
          transform: translateX(-10px);
        }
      }

      @keyframes initialDotHop {
        from {
          transform: translateY(0);
          opacity: 0.55;
        }

        to {
          transform: translateY(-7px);
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        .initial-loader-card {
          padding: 26px 20px 23px;
          border-radius: 26px;
        }

        .initial-loader-logo {
          width: 76px;
          height: 76px;

          font-size: 37px;
        }

        .initial-star-one {

        .initial-heart-one {

        }
      }

        #initial-loader *::before,
        #initial-loader *::after {

          animation-iteration-count: 1 !important;
        }

    </div>

    <div id="root"></div>

    <script>
      window.hideInitialLoader = function () {
        const loader = document.getElementById("initial-loader");

        if (!loader || loader.classList.contains("loader-hidden")) {
          return;
        }

        loader.classList.add("loader-hidden");

        window.setTimeout(function () {
          loader.remove();
        }, 400);
      };
    </script>
